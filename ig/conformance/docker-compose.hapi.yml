# Second conformance deployment — HAPI FHIR (Java / Smile CDR OSS).
# Used to show that the IG's synthetic examples validate somewhere other than the
# toolchain that produced them, and to run the negative fixtures. It shares the HL7
# Java validation core with the reference validator, so this is portability across
# deployments, not independence across implementations.
#
#   docker compose -f docker-compose.hapi.yml up -d
#   # FHIR base: http://localhost:8080/fhir   (metadata: .../fhir/metadata)
#   docker compose -f docker-compose.hapi.yml down
#
# Default H2 in-memory store is fine for a conformance smoke test (no persistence needed).
services:
  hapi:
    # Pinned by digest for reproducibility. This digest is HAPI FHIR Server 8.10.0
    # (verified from the running server's CapabilityStatement.software.version, and
    # recorded in conformance/out/negative-conformance.json). Using :latest here would
    # silently change the server under test between runs.
    image: hapiproject/hapi@sha256:55213612779ab3eeec919226b7bad378f0061ade823393a61d7dd46dd5087a3d
    container_name: hapi-dysphagia
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"
      hapi.fhir.allow_multiple_delete: "true"
      # Let the server fetch/validate against our uploaded profiles.
      hapi.fhir.enforce_referential_integrity_on_write: "false"
